#
# For every board (the hood board, pico-serial W, Line and WB): the generated hardware
# files are up to date with the netlist script, the schematic passes ERC, and
# the PCB passes DRC and matches the schematic. (The PCBs aren't re-routed
# here: that needs Freerouting and takes minutes.)
name: hardware

on:
  push:
    paths: ["hardware/**", ".github/workflows/hardware.yml"]
  pull_request:
    paths: ["hardware/**", ".github/workflows/hardware.yml"]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: KiCad 9
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends kicad

      - name: Netlists and schematics match the netlist script
        run: |
          for v in hood w line wb; do
            python3 hardware/netlist/build_netlist.py --variant $v
            python3 hardware/kicad/build_schematic.py --variant $v
          done
          python3 hardware/kicad/lib/make_footprints.py
          git diff --exit-code -- hardware/netlist hardware/kicad firmware/src/generated

      - name: ERC
        run: |
          for b in pico-serial pico-serial-w pico-serial-line pico-serial-wb; do
            kicad-cli sch erc --severity-error --exit-code-violations -o erc.rpt hardware/kicad/$b.kicad_sch || { cat erc.rpt; exit 1; }
          done

      - name: DRC, and the PCBs match their schematics
        run: |
          for b in pico-serial pico-serial-w pico-serial-line pico-serial-wb; do
            kicad-cli pcb drc --schematic-parity --severity-error --exit-code-violations -o drc.rpt hardware/kicad/$b.kicad_pcb || { cat drc.rpt; exit 1; }
          done
