#
# The generated hardware files are up to date with the netlist script, the
# schematic passes ERC, and the PCB passes DRC and matches the schematic.
# (The PCB isn't re-routed here: that needs Freerouting and takes minutes.)
name: hardware

on:
  push:
    paths: ["hardware/**", ".github/workflows/hardware.yml"]
  pull_request:
    paths: ["hardware/**", ".github/workflows/hardware.yml"]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: KiCad 9
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends kicad

      - name: Netlist and schematic match the netlist script
        run: |
          python3 hardware/netlist/build_netlist.py
          python3 hardware/kicad/build_schematic.py
          git diff --exit-code -- hardware/netlist hardware/kicad

      - name: ERC
        run: kicad-cli sch erc --severity-error --exit-code-violations -o erc.rpt hardware/kicad/pico-serial.kicad_sch || (cat erc.rpt; exit 1)

      - name: DRC, and the PCB matches the schematic
        run: kicad-cli pcb drc --schematic-parity --severity-error --exit-code-violations -o drc.rpt hardware/kicad/pico-serial.kicad_pcb || (cat drc.rpt; exit 1)
